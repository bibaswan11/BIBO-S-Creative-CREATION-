<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bibo's Creation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <img src="logo.png" alt="Logo" class="logo" />
  <h2>Bibo's Creation</h2>
</header>

<script src="script.js"></script>

<nav>
  <button onclick="filterCategory('all')">All</button>
  <button onclick="filterCategory('earrings')">Earrings</button>
  <button onclick="filterCategory('drawings')">Drawings</button>
</nav>

<div id="gallery"></div>

<div id="owner-panel">
  <h3>Owner Upload Panel</h3>
  <input type="text" id="item-title" placeholder="Item Title" />
  <input type="text" id="item-category" placeholder="Category (earrings/drawings)" />
  <input type="text" id="item-img" placeholder="Image URL" />
  <textarea id="item-desc" placeholder="Description"></textarea>
  <button onclick="addItem()">Upload Item</button>
</div>
   <!-- This is where products will appear -->
  <div id="product-container"></div>

  <script src="script.js"></script>

</body>
</html>
